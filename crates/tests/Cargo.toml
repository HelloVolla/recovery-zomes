[package]
name = "zomes_tests"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["rlib"]
name = "zomes_tests"

[dependencies]
serde = { workspace = true, features = ["derive"] }
holochain = { workspace = true, features = ["sweettest"] }
tokio = { workspace = true, features = ["full"] }
hdk = { workspace = true }
storage_integrity = { workspace = true, optional = true }
membrane_integrity = { workspace = true, optional = true }
shared_types = { workspace = true }
yaml_serde = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[features]
default = []
single_agent = ["dep:storage_integrity"]
multi_agent = []
registry_test = []
